
# Multi-container compose — mirrors the PaaS deployment model.
# Three separate services: api, web, admin.
# An nginx reverse proxy ties them together under one domain.
#
# For single-container deployment (one process serves everything),
# see Dockerfile at the repo root and docker-compose.single.yml.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cphub
      POSTGRES_USER: cphub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cphub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://cphub:${POSTGRES_PASSWORD:-changeme}@db:5432/cphub
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://cloudpartnerhub.com}
    restart: unless-stopped
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        # BASE_PATH=/ because the admin runs at its own hostname,
        # not as a sub-path of the web domain.
        BASE_PATH: /
        VITE_API_URL: http://api:3001
    restart: unless-stopped
    ports:
      - "5173:5173"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - admin
    ports:
      - "80:80"
    volumes:
      - ./nginx.paas.conf.example:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
