services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cphub
      POSTGRES_USER: cphub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cphub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://cloudpartnerhub.com}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      DATABASE_URL: postgres://cphub:${POSTGRES_PASSWORD:-changeme}@db:5432/cphub
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SITE_URL: ${VITE_SITE_URL:-https://cloudpartnerhub.com}

volumes:
  postgres_data:
